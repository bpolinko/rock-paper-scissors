<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Rock Paper Scissors</title>
</head>
<body>
    
   <h1> Rock Paper Scissors</h1>
     
    <div class="resultsBox">
        <div> Result:</div>
        <div id="result"></div>
    </div>
    <div class="scoreboard">
        <div id="userName">User:</div>
        <div id="userScore">0</div>
        <div>CPU:</div>
        <div id="cpuScore">0</div>
    </div>
    <h4> Select your choice:</h4>

    <div class="Buttons">
        <button class="Rock" onclick="clickRock()">Rock</button>
        <button class="Paper" onclick="clickPaper()">Paper</button>
        <button class="Scissors" onclick="clickScissors()">Scissors</button>
    </div>

    <script src="javascript.js"></script>
</body>
</html>
